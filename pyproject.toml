[project]
name = "mts"
version = "0.1.0"
description = "Pedestrian multi-object tracking on MOT17: fine-tuned RT-DETR, a tracker from scratch with ablations, ONNX Runtime deployment"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.1", "torchvision==0.22.1", "transformers", "scipy", "numpy", "pandas", "matplotlib", "pillow",
    "opencv-python-headless", "onnx", "onnxruntime-gpu==1.24.4", "tqdm", "pycocotools",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
